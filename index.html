<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>헬스 체크</title>
  <meta name="description" content="헬스장 출석과 운동 부위를 체크하는 앱">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="헬스체크">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap">
  <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <main class="views" id="views">
      <section class="view" id="view-today" aria-label="오늘"></section>
      <section class="view" id="view-calendar" aria-label="달력" hidden></section>
      <section class="view" id="view-stats" aria-label="통계" hidden></section>
      <section class="view" id="view-social" aria-label="피드" hidden></section>
      <section class="view" id="view-settings" aria-label="설정" hidden></section>
    </main>

    <nav class="tabbar" aria-label="메뉴">
      <button class="tab" data-action="tab" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>오늘</span>
      </button>
      <button class="tab" data-action="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>달력</span>
      </button>
      <button class="tab" data-action="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>
        <span>기록</span>
      </button>
      <button class="tab" data-action="tab" data-tab="social">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.3a4.5 4.5 0 0 1 5 5.2"/></svg>
        <span>피드</span>
      </button>
      <button class="tab" data-action="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span>설정</span>
      </button>
    </nav>
  </div>

  <div class="backdrop" id="backdrop" data-action="close-sheet" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <input type="file" id="photo-input" accept="image/*" hidden>

  <section class="photo-editor" id="photo-editor" role="dialog" aria-modal="true" aria-label="오운완 사진" hidden>
    <header class="pe-bar">
      <button class="icon-btn" data-action="photo-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span class="kicker pe-title" id="photo-title">오운완</span>
      <div class="seg" id="photo-format" role="group" aria-label="사진 비율">
        <button data-action="photo-format" data-format="orig" aria-pressed="true">원본</button>
        <button data-action="photo-format" data-format="story" aria-pressed="false">스토리</button>
      </div>
      <button class="pill pe-flip" id="photo-flip" data-action="photo-flip" aria-pressed="false" aria-label="사진 좌우 반전">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7L3 17h6z"/><path d="M15 7l6 10h-6z"/></svg>
        <span>반전</span>
      </button>
    </header>
    <div class="pe-stage">
      <p class="pe-loading" id="photo-loading">사진 만드는 중…</p>
      <img id="photo-preview" alt="오운완 사진 미리보기" hidden>
    </div>
    <label class="pe-crew" id="photo-crew-row" hidden>
      <input type="checkbox" id="photo-crew">
      <span>피드에도 올리기</span>
    </label>
    <div class="pe-actions">
      <button class="btn" data-action="photo-retake">다시 고르기</button>
      <button class="btn primary" data-action="photo-save" id="photo-save" disabled>저장 · 공유</button>
    </div>
  </section>

  <noscript><p style="padding:24px;color:#fff">이 앱은 자바스크립트가 켜져 있어야 동작해요.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
